
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Junoon Attendance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background-image:
    linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
    url("./attendance-bg.webp");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

    .card {
      width: 100%;
      max-width: 430px;
      padding: 26px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 27px;
      color: #222;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin: 0 0 24px;
      font-size: 14px;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 16px 0 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    .camera-box {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #222;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }

    video, #selfiePreview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #selfiePreview {
      display: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .secondary {
      background: #ececec;
      color: #222;
    }

    .primary {
      background: #176b45;
      color: white;
    }

    #status {
      display: none;
      padding: 12px;
      margin-top: 16px;
      border-radius: 9px;
      text-align: center;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    #status.success {
      display: block;
      background: #e4f5e9;
      color: #176b45;
    }

    #status.error {
      display: block;
      background: #fde8e7;
      color: #a12622;
    }

    #status.info {
      display: block;
      background: #e8f0fe;
      color: #174ea6;
    }

    .small {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 14px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Junoon Attendance</h1>
    <p class="subtitle">Enter your name and take a selfie to mark attendance.</p>

    <form id="attendanceForm">
      <label for="personName">Enter your name</label>
      <input
        id="personName"
        type="text"
        placeholder="Enter full name"
        autocomplete="name"
        required
      >

      <label>Take a selfie</label>
      <div class="camera-box">
        <video id="camera" autoplay muted playsinline></video>
        <img id="selfiePreview" alt="Captured selfie">
      </div>

      <button type="button" id="captureBtn" class="secondary">
        Take Selfie
      </button>

      <button type="button" id="retakeBtn" class="secondary" hidden>
        Retake Selfie
      </button>

      <button type="submit" id="submitBtn" class="primary">
        Submit Attendance
      </button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <p class="small">Please wait for the success message before leaving.</p>
  </main>

  <!-- Apps Script receives the form in this hidden iframe. -->
  <iframe
    name="submitFrame"
    id="submitFrame"
    title="Attendance submission"
    hidden>
  </iframe>

  <form
    id="backendForm"
    method="POST"
    target="submitFrame"
    action="https://script.google.com/macros/s/AKfycbx4U9EgFUzmzZhyj71czEi_P0Unwv_g3Id_RLJWtlR1ynrjKbN4uX6ZxUCFvOpDLVt1/exec"
    hidden>
    <input type="hidden" name="name" id="backendName">
    <input type="hidden" name="imageData" id="backendImage">
  </form>

  <script>
    const video = document.getElementById("camera");
    const preview = document.getElementById("selfiePreview");
    const nameInput = document.getElementById("personName");
    const captureBtn = document.getElementById("captureBtn");
    const retakeBtn = document.getElementById("retakeBtn");
    const submitBtn = document.getElementById("submitBtn");
    const attendanceForm = document.getElementById("attendanceForm");
    const backendForm = document.getElementById("backendForm");
    const statusBox = document.getElementById("status");

    let cameraStream = null;
    let selfieData = "";
    let isSubmitting = false;
    let responseTimer = null;

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = type;
    }

    async function startCamera() {
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("Camera access is not supported in this browser.");
        }

        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });

        video.srcObject = cameraStream;
        await video.play();
      } catch (error) {
        showStatus(
          "Unable to open the camera. Allow camera permission and reload the page.",
          "error"
        );
      }
    }

    function takeSelfie() {
      if (!cameraStream || !video.videoWidth) {
        showStatus("Camera is not ready yet. Please wait a moment.", "error");
        return;
      }

      const canvas = document.createElement("canvas");
      const maxWidth = 640;
      const scale = Math.min(1, maxWidth / video.videoWidth);

      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);

      const context = canvas.getContext("2d");
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      selfieData = canvas.toDataURL("image/jpeg", 0.75);

      preview.src = selfieData;
      preview.style.display = "block";
      video.style.display = "none";

      captureBtn.hidden = true;
      retakeBtn.hidden = false;

      showStatus("Selfie captured. You can submit your attendance.", "info");
    }

    function retakeSelfie() {
      selfieData = "";
      preview.removeAttribute("src");
      preview.style.display = "none";
      video.style.display = "block";

      captureBtn.hidden = false;
      retakeBtn.hidden = true;
      statusBox.className = "";
      statusBox.textContent = "";
    }

    captureBtn.addEventListener("click", takeSelfie);
    retakeBtn.addEventListener("click", retakeSelfie);

    attendanceForm.addEventListener("submit", function(event) {
      event.preventDefault();

      if (isSubmitting) return;

      const name = nameInput.value.trim();

      if (!name) {
        showStatus("Please enter your name.", "error");
        nameInput.focus();
        return;
      }

      if (!selfieData) {
        showStatus("Please take a selfie before submitting.", "error");
        return;
      }

      isSubmitting = true;
      submitBtn.disabled = true;
      captureBtn.disabled = true;
      retakeBtn.disabled = true;

      showStatus("Submitting attendance. Please wait...", "info");

      document.getElementById("backendName").value = name;
      document.getElementById("backendImage").value = selfieData;

      // The backend response will notify this page through postMessage.
      responseTimer = setTimeout(function() {
        if (isSubmitting) {
          isSubmitting = false;
          submitBtn.disabled = false;
          captureBtn.disabled = false;
          retakeBtn.disabled = false;

          showStatus(
            "No confirmation received. Check the attendance sheet before retrying to avoid duplicate entries.",
            "error"
          );
        }
      }, 30000);

      backendForm.submit();
    });

    window.addEventListener("message", function(event) {

      const data = event.data;

      if (!data || data.type !== "junoon-attendance-result") {
        return;
      }

      let result = data.result;

      if (typeof result === "string") {
        try {
          result = JSON.parse(result);
        } catch (error) {
          showStatus("Received an unreadable response. Check the attendance sheet.", "error");
          return;
        }
      }

      if (!result || typeof result.success !== "boolean") return;

      clearTimeout(responseTimer);
      isSubmitting = false;

      submitBtn.disabled = false;
      captureBtn.disabled = false;
      retakeBtn.disabled = false;

      if (result.success) {
        showStatus("Attendance submitted successfully!", "success");

        // Clear the previous person's details and selfie.
        nameInput.value = "";
        selfieData = "";
        preview.removeAttribute("src");
        preview.style.display = "none";
        video.style.display = "block";

        captureBtn.hidden = false;
        retakeBtn.hidden = true;

        // Keep the camera stream open for the next person.
        nameInput.focus();
      } else {
        showStatus(
          result.message || "Submission failed. Please try again.",
          "error"
        );
      }
    });

    startCamera();
  </script>
</body>
</html>
