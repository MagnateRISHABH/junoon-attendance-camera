
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Junoon Attendance</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }
    .card {
      max-width: 460px;
      margin: 20px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 3px 15px #0001;
    }
    h1 { text-align: center; font-size: 25px; }
    label { display: block; margin: 18px 0 8px; font-weight: bold; }
    input[type="text"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }
    video, #preview {
      display: block;
      width: 100%;
      margin-top: 12px;
      border-radius: 10px;
      background: #eee;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #174ea6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
    .secondary { background: #555; }
    #status { margin-top: 16px; line-height: 1.5; overflow-wrap: anywhere; }
    .note { color: #666; font-size: 13px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Junoon Attendance</h1>
    <p style="text-align:center">Enter your name and take a selfie.</p>

    <form id="attendanceForm">
      <label for="visitorName">Full name</label>
      <input id="visitorName" type="text" maxlength="100"
             placeholder="Enter your name" required>

      <label>Selfie</label>
      <video id="camera" autoplay playsinline muted hidden></video>
      <img id="preview" alt="Captured selfie preview" hidden>

      <button type="button" id="startCamera">Open Camera</button>
      <button type="button" id="capture" hidden>Take Selfie</button>
      <button type="button" id="retake" class="secondary" hidden>
        Retake Selfie
      </button>

      <button type="submit" id="submitButton" disabled>
        Submit Attendance
      </button>
      <p class="note">Allow camera access when prompted. Your selfie is
        submitted with your attendance record.</p>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <canvas id="canvas" hidden></canvas>

    <!-- The response is loaded here because the request is cross-origin. -->
    <iframe name="submitFrame" title="Submission frame" hidden></iframe>
    <form id="uploadForm" method="POST" target="submitFrame" hidden>
      <input name="name">
      <textarea name="imageData"></textarea>
    </form>
  </main>

<script>
  // IMPORTANT: Replace this value with your Apps Script Web app URL ending /exec.
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4U9EgFUzmzZhyj71czEi_P0Unwv_g3Id_RLJWtlR1ynrjKbN4uX6ZxUCFvOpDLVt1/exec";

  const camera = document.getElementById("camera");
  const preview = document.getElementById("preview");
  const canvas = document.getElementById("canvas");
  const statusBox = document.getElementById("status");
  const startButton = document.getElementById("startCamera");
  const captureButton = document.getElementById("capture");
  const retakeButton = document.getElementById("retake");
  const submitButton = document.getElementById("submitButton");
  const nameInput = document.getElementById("visitorName");
  const uploadForm = document.getElementById("uploadForm");

  let stream = null;
  let imageData = "";

  async function openCamera() {
    try {
      statusBox.textContent = "Opening camera…";
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "user" } },
        audio: false
      });

      camera.srcObject = stream;
      camera.hidden = false;
      preview.hidden = true;
      startButton.hidden = true;
      captureButton.hidden = false;
      retakeButton.hidden = true;
      submitButton.disabled = true;
      statusBox.textContent = "Camera ready. Take your selfie.";
    } catch (error) {
      statusBox.textContent =
        "Camera error: " + error.name + ". " + error.message +
        " Please allow camera access and try again.";
    }
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
    camera.srcObject = null;
  }

  function captureSelfie() {
    if (!camera.videoWidth || !camera.videoHeight) {
      statusBox.textContent = "Camera is not ready. Please try again.";
      return;
    }

    // Resize and compress the photo to reduce upload size.
    const maxWidth = 640;
    const scale = Math.min(1, maxWidth / camera.videoWidth);
    canvas.width = Math.round(camera.videoWidth * scale);
    canvas.height = Math.round(camera.videoHeight * scale);

    const context = canvas.getContext("2d");
    context.drawImage(camera, 0, 0, canvas.width, canvas.height);
    imageData = canvas.toDataURL("image/jpeg", 0.70);

    preview.src = imageData;
    preview.hidden = false;
    camera.hidden = true;
    captureButton.hidden = true;
    retakeButton.hidden = false;
    submitButton.disabled = false;
    stopCamera();
    statusBox.textContent = "Selfie captured. Check it before submitting.";
  }

  startButton.addEventListener("click", openCamera);
  captureButton.addEventListener("click", captureSelfie);

  retakeButton.addEventListener("click", () => {
    imageData = "";
    preview.hidden = true;
    retakeButton.hidden = true;
    submitButton.disabled = true;
    openCamera();
  });

  document.getElementById("attendanceForm").addEventListener("submit", event => {
    event.preventDefault();

    const visitorName = nameInput.value.trim();

    if (!visitorName) {
      statusBox.textContent = "Please enter your name.";
      return;
    }
    if (!imageData) {
      statusBox.textContent = "Please take a selfie first.";
      return;
    }
    if (!SCRIPT_URL.startsWith("https://script.google.com/") ||
        !SCRIPT_URL.endsWith("/exec")) {
      statusBox.textContent =
        "Setup incomplete: add your Apps Script Web app URL in the code.";
      return;
    }

    uploadForm.action = SCRIPT_URL;
    uploadForm.elements.name.value = visitorName;
    uploadForm.elements.imageData.value = imageData;

    submitButton.disabled = true;
    statusBox.textContent =
      "Submitting attendance… Please wait and do not close this page.";

    try {
      uploadForm.submit();
      statusBox.textContent =
        "Submission sent. Please wait while the record is processed. " +
        "Ask the administrator to confirm it appears in the attendance Sheet.";
    } catch (error) {
      submitButton.disabled = false;
      statusBox.textContent =
        "Could not send the submission: " + error.message;
    }
  });

  window.addEventListener("pagehide", stopCamera);
</script>
</body>
</html>
