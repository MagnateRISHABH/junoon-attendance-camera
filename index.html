
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Junoon Attendance</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .card {
      max-width: 460px;
      margin: 20px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 3px 15px #0001;
    }

    h1 { text-align: center; font-size: 25px; }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }

    video, #preview {
      display: block;
      width: 100%;
      margin-top: 12px;
      border-radius: 10px;
      background: #eee;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #174ea6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .secondary { background: #555; }

    #status {
      margin-top: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .note { color: #666; font-size: 13px; }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <main class="card">
    <h1>Junoon Attendance</h1>
    <p style="text-align:center">
      Enter your name and take a selfie.
    </p>

    <form id="attendanceForm">
      <label for="visitorName">Full name</label>
      <input
        id="visitorName"
        type="text"
        maxlength="100"
        placeholder="Enter your name"
        autocomplete="off"
        required
      >

      <label>Selfie</label>

      <video id="camera" autoplay playsinline muted hidden></video>
      <img id="preview" alt="Captured selfie preview" hidden>

      <button type="button" id="startCamera">Open Camera</button>

      <button type="button" id="capture" hidden>
        Take Selfie
      </button>

      <button type="button" id="retake" class="secondary" hidden>
        Retake Selfie
      </button>

      <button type="submit" id="submitButton" disabled>
        Submit Attendance
      </button>

      <p class="note">
        Allow camera access when prompted. Your selfie will be saved
        with your attendance record.
      </p>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <canvas id="canvas" hidden></canvas>

    <iframe
      name="submitFrame"
      id="submitFrame"
      title="Attendance submission"
      hidden
    ></iframe>

    <form
      id="uploadForm"
      method="POST"
      target="submitFrame"
      hidden
    >
      <input name="name">
      <textarea name="imageData"></textarea>
    </form>
  </main>

<script>
  const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbx4U9EgFUzmzZhyj71czEi_P0Unwv_g3Id_RLJWtlR1ynrjKbN4uX6ZxUCFvOpDLVt1/exec";

  const camera = document.getElementById("camera");
  const preview = document.getElementById("preview");
  const canvas = document.getElementById("canvas");
  const statusBox = document.getElementById("status");
  const startButton = document.getElementById("startCamera");
  const captureButton = document.getElementById("capture");
  const retakeButton = document.getElementById("retake");
  const submitButton = document.getElementById("submitButton");
  const nameInput = document.getElementById("visitorName");
  const attendanceForm = document.getElementById("attendanceForm");
  const uploadForm = document.getElementById("uploadForm");
  const submitFrame = document.getElementById("submitFrame");

  let stream = null;
  let imageData = "";
  let submitting = false;
  let responseReceived = false;
  let submissionTimer = null;
  let fallbackTimer = null;

  function setStatus(message) {
    statusBox.textContent = message;
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    camera.srcObject = null;
  }

  async function openCamera() {
    if (submitting) return;

    stopCamera();
    setStatus("Opening camera…");

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "user" } },
        audio: false
      });

      camera.srcObject = stream;
      camera.hidden = false;
      preview.hidden = true;
      startButton.hidden = true;
      captureButton.hidden = false;
      retakeButton.hidden = true;
      submitButton.disabled = true;

      setStatus("Camera ready. Take your selfie.");
    } catch (error) {
      camera.hidden = true;
      startButton.hidden = false;

      setStatus(
        "Camera error: " + error.name +
        ". Please allow camera access and try again."
      );
    }
  }

  function captureSelfie() {
    if (!camera.videoWidth || !camera.videoHeight) {
      setStatus("Camera is not ready. Please try again.");
      return;
    }

    const maxWidth = 640;
    const scale = Math.min(1, maxWidth / camera.videoWidth);

    canvas.width = Math.round(camera.videoWidth * scale);
    canvas.height = Math.round(camera.videoHeight * scale);

    canvas.getContext("2d").drawImage(
      camera, 0, 0, canvas.width, canvas.height
    );

    imageData = canvas.toDataURL("image/jpeg", 0.70);

    preview.src = imageData;
    preview.hidden = false;
    camera.hidden = true;

    stopCamera();

    captureButton.hidden = true;
    retakeButton.hidden = false;
    startButton.hidden = true;
    submitButton.disabled = false;

    setStatus("Selfie captured. Check it before submitting.");
  }

  function retakeSelfie() {
    if (submitting) return;

    imageData = "";
    preview.src = "";
    preview.hidden = true;
    retakeButton.hidden = true;
    submitButton.disabled = true;

    openCamera();
  }

  function resetForNextPerson() {
    stopCamera();

    attendanceForm.reset();
    uploadForm.reset();

    imageData = "";
    preview.removeAttribute("src");
    preview.hidden = true;
    camera.hidden = true;

    startButton.hidden = false;
    captureButton.hidden = true;
    retakeButton.hidden = true;

    submitButton.disabled = true;
    submitButton.textContent = "Submit Attendance";
    submitting = false;

    nameInput.focus();
    setStatus("Ready for the next person.");
  }

  function handleBackendResult(result) {
    if (!submitting || responseReceived) return;

    responseReceived = true;
    clearTimeout(submissionTimer);
    clearTimeout(fallbackTimer);

    if (result && result.success === true) {
      stopCamera();

      // Show the success popup before clearing the current entry.
      window.alert("Attendance submitted successfully!");

      resetForNextPerson();
      return;
    }

    submitting = false;
    submitButton.disabled = false;
    submitButton.textContent = "Submit Attendance";

    setStatus(
      "Submission failed: " +
      ((result && result.message) || "Unknown error.") +
      " Please check the Sheet before trying again."
    );
  }

  // Receive the backend response from the Apps Script iframe.
  window.addEventListener("message", function(event) {
    let hostname = "";

    try {
      hostname = new URL(event.origin).hostname;
    } catch (_) {
      return;
    }

    const trustedOrigin =
      hostname === "script.google.com" ||
      hostname.endsWith(".googleusercontent.com");

    if (!trustedOrigin) return;

    if (!event.data ||
        event.data.type !== "junoon-attendance-result") {
      return;
    }

    let result = event.data.result;

    // Accept either a JSON object or a JSON string.
    if (typeof result === "string") {
      try {
        result = JSON.parse(result);
      } catch (_) {
        setStatus(
          "The server response could not be read. Check the Sheet " +
          "before trying again to avoid duplicate entries."
        );
        return;
      }
    }

    handleBackendResult(result);
  });

  attendanceForm.addEventListener("submit", function(event) {
    event.preventDefault();

    if (submitting) return;

    const visitorName = nameInput.value.trim();

    if (!visitorName) {
      setStatus("Please enter your name.");
      nameInput.focus();
      return;
    }

    if (!imageData) {
      setStatus("Please take a selfie first.");
      return;
    }

    if (!SCRIPT_URL.endsWith("/exec")) {
      setStatus("The Apps Script URL is not configured correctly.");
      return;
    }

    submitting = true;
    responseReceived = false;
    submitButton.disabled = true;
    submitButton.textContent = "Submitting…";

    setStatus("Submitting attendance. Please wait…");
    stopCamera();

    uploadForm.action = SCRIPT_URL;
    uploadForm.elements.name.value = visitorName;
    uploadForm.elements.imageData.value = imageData;

    try {
      uploadForm.submit();
    } catch (error) {
      submitting = false;
      submitButton.disabled = false;
      submitButton.textContent = "Submit Attendance";

      setStatus(
        "Could not send the submission. Check the Sheet before retrying."
      );
      return;
    }

    // If the backend response is delayed, do not assume success or failure.
    submissionTimer = setTimeout(function() {
      if (!submitting || responseReceived) return;

      setStatus(
        "No confirmation received yet. Check the attendance Sheet " +
        "before retrying, to avoid duplicate entries."
      );

      submitButton.disabled = true;
      submitButton.textContent = "Waiting for confirmation…";
    }, 30000);

    // Keep the form locked until a response arrives or the page is reloaded.
    fallbackTimer = setTimeout(function() {
      if (!submitting || responseReceived) return;

      setStatus(
        "Confirmation is still unavailable. Please ask the administrator " +
        "to check the Sheet. Do not submit again until verified."
      );
    }, 60000);
  });

  window.addEventListener("pagehide", stopCamera);

  nameInput.focus();
</script>
</body>
</html>
